<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css"> 
</head>
<body>
    <header>
        <div class="hc">
            <img src="Logo.jpg" alt="Logo" width="200" class="limg">
            <div class="tc">
                <h1>Login</h1>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="company.html">Company Profile</a></li>
                <li><a href="registration.html">Course Registration</a></li>
                <li><a href="learning.html">Interactive Learning</a></li>
                <li><a href="assessment.html">Assessment</a></li>
                <li><a href="feedback.html">Feedback & Contact Us</a></li>
                <li><a href="tv_parts.html">TV Internal Parts</a></li>
                <li><a href="mobile_parts.html">Mobile Internal Parts</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="box">
            <h2>Login</h2>
            <form id="loginForm" class="personal-info" action="#" method="post">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br><br>
                
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required><br><br>
                
                <input type="submit" value="Login" class="submit-btn">
            </form>
            <div id="loginMessage" class="result-box"></div>
        </div>
    </main>
    <footer>
        <p>&copy; 2023 MKS Electronics</p>
    </footer>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const loginMessage = document.getElementById("loginMessage");

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailRegex.test(email)) {
                loginMessage.innerHTML = `<p>❌ Invalid email format.</p>`;
                loginMessage.style.backgroundColor = "#FF6B6B";
                return;
            }

            if (password.length < 6) {
                loginMessage.innerHTML = `<p>❌ Password must be at least 6 characters long.</p>`;
                loginMessage.style.backgroundColor = "#FF6B6B";
                return;
            }

            loginMessage.innerHTML = `<p>✅ Login successful! Redirecting...</p>`;
            loginMessage.style.backgroundColor = "#50E3C2";

            setTimeout(() => {
                window.location.href = "company.html";
            }, 1500);
        });
    </script>
</body>
</html>
